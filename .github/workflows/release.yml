name: 'release'

on:
    push:
        branches:
            - master

# One release at a time. A run that is already releasing is never cancelled,
# because it may have pushed the release commit and tag already.
concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

# semantic-release commits the version bump with this identity

env:
    GIT_AUTHOR_NAME: '@dhis2-bot'
    GIT_AUTHOR_EMAIL: 'apps@dhis2.org'
    GIT_COMMITTER_NAME: '@dhis2-bot'
    GIT_COMMITTER_EMAIL: 'apps@dhis2.org'
    CI: true

jobs:
    release:
        # Tell the deploy jobs below whether a release was cut, and on which commit
        outputs:
            released: ${{ steps.release.outputs.released }}
            ref: ${{ steps.release.outputs.ref }}
        # dhis2-bot's only pushes to master are release commits, which have nothing to release
        if: ${{ !github.event.repository.fork && github.actor != 'dhis2-bot' }}
        runs-on: ubuntu-latest
        steps:
            # semantic-release needs the full history and tags to find the last
            # release. The bot token lets it push to master.
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  token: ${{ secrets.DHIS2_BOT_GITHUB_TOKEN }}

            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: lts/*
                  cache: pnpm

            # master only accepts signed commits
            - uses: dhis2/action-commit-signing@v1
              with:
                  ssh-signing-key: ${{ secrets.DHIS2_BOT_SSH_SIGNING_KEY }}
                  ssh-signing-key-passphrase: ${{ secrets.DHIS2_BOT_SSH_SIGNING_PASSPHRASE }}

            # The postinstall script only sets up local development (git hooks,
            # generated API types), which a build does not need. The build
            # generates the translations (src/locales) itself.
            - name: Install
              run: pnpm install --frozen-lockfile --ignore-scripts

            - name: Release
              id: release
              # Runs semantic-release (configured in .releaserc.yaml). When the
              # commits since the last release contain a feat, fix or perf, it
              # bumps the version, builds the app, pushes the release commit and
              # tag to master and publishes the GitHub release. Otherwise it does
              # nothing. A failure fails the step, which skips everything below
              # and sends the Slack alert.
              #
              # semantic-release only makes a commit when it releases, so a moved
              # HEAD means this run released. HEAD is then the release commit,
              # which the deploy jobs check out.
              #
              # semantic-release runs with .github/semantic-release/git in
              # place of git, which keeps its git note from being pushed. The
              # script explains why.
              run: |
                  REAL_GIT=$(command -v git)
                  export REAL_GIT
                  export PATH="$GITHUB_WORKSPACE/.github/semantic-release:$PATH"
                  head_before=$(git rev-parse HEAD)
                  pnpm exec semantic-release
                  if [ "$(git rev-parse HEAD)" != "$head_before" ]; then
                      echo "released=true" >> "$GITHUB_OUTPUT"
                      echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
                  fi
              env:
                  GITHUB_TOKEN: ${{ secrets.DHIS2_BOT_GITHUB_TOKEN }}

            # DHIS2 core bundles apps from their d2-ci repo, so it gets the
            # exact build semantic-release made for the release
            - name: Copy build to d2-ci
              if: steps.release.outputs.released == 'true'
              uses: dhis2/deploy-build@master
              with:
                  build-dir: build/app
                  github-token: ${{ secrets.DHIS2_BOT_GITHUB_TOKEN }}

            # Needs the App Hub `id` in d2.config.js
            # - name: Publish to the App Hub
            #   if: steps.release.outputs.released == 'true'
            #   run: ./node_modules/.bin/d2-app-scripts publish
            #   env:
            #       D2_APP_HUB_TOKEN: ${{ secrets.DHIS2_BOT_APPHUB_TOKEN }}

    # The deploy workflows build the app themselves, from the release commit
    deploy-netlify:
        needs: release
        if: needs.release.outputs.released == 'true'
        uses: ./.github/workflows/netlify-deploy-master.yml
        with:
            ref: ${{ needs.release.outputs.ref }}
        secrets: inherit

    deploy-im-instance:
        needs: release
        if: needs.release.outputs.released == 'true'
        uses: ./.github/workflows/deploy-to-im-instance.yml
        with:
            ref: ${{ needs.release.outputs.ref }}
        secrets: inherit

    # Something went wrong in the release job: someone needs to look at it
    report-release-failure:
        runs-on: ubuntu-latest
        needs: release
        if: ${{ failure() && !cancelled() }}
        steps:
            - name: Send failure message to analytics-internal-bot Slack channel
              uses: rtCamp/action-slack-notify@v2
              env:
                  SLACK_WEBHOOK: ${{ secrets.SLACK_BACKEND_WEBHOOK }}
                  SLACK_CHANNEL: 'analytics-internal-bot'
                  SLACK_MESSAGE: 'Individual Data Visualizer App release failed'
                  SLACK_COLOR: '#ff0000'
