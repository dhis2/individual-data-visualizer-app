name: 'publish release to a d2-ci version branch'

# DHIS2 core's patch branches pin each bundled app to a d2-ci branch named
# after its version (`#v1.2.3` in apps-to-bundle.json). deploy-build names the
# d2-ci branch after the ref that started the run, so a run for the release
# tag creates that branch.
#
# Org secrets: DHIS2_BOT_GITHUB_TOKEN

on:
    # semantic-release pushes the release tag with dhis2-bot's token, which
    # starts this workflow. A push with the default GITHUB_TOKEN would not.
    push:
        tags:
            - 'v*'

env:
    CI: true

jobs:
    publish-to-d2-ci:
        # Only release tags. A tag someone pushes by hand is not a release.
        if: ${{ !github.event.repository.fork && github.actor == 'dhis2-bot' }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: lts/*
                  cache: pnpm

            - name: Install
              run: pnpm install --frozen-lockfile --ignore-scripts

            - name: Build
              run: pnpm d2-app-scripts build

            - name: Copy build to d2-ci
              uses: dhis2/deploy-build@master
              with:
                  build-dir: build/app
                  github-token: ${{ secrets.DHIS2_BOT_GITHUB_TOKEN }}

    report-failure:
        runs-on: ubuntu-latest
        needs: publish-to-d2-ci
        if: ${{ failure() && !cancelled() }}
        steps:
            - name: Send failure message to analytics-internal-bot Slack channel
              uses: rtCamp/action-slack-notify@v2
              env:
                  SLACK_WEBHOOK: ${{ secrets.SLACK_BACKEND_WEBHOOK }}
                  SLACK_CHANNEL: 'analytics-internal-bot'
                  SLACK_MESSAGE: 'Individual Data Visualizer App failed to publish ${{ github.ref_name }} to d2-ci'
                  SLACK_COLOR: '#ff0000'
