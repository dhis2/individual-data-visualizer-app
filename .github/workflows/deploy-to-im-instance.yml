name: 'deploy to IM idv-playground instance'

on:
    schedule:
        - cron: '0 5 * * *' # Runs every day at 5:00 AM UTC
    workflow_dispatch: # Allows manual triggering of the workflow
    # The release workflow calls this after a release, with the release commit
    # as ref. A plain checkout would get the merge commit that started the
    # release, which predates the version bump. Checking out master instead
    # could pick up a commit merged while the release was building.
    workflow_call:
        inputs:
            ref:
                description: 'The commit to deploy'
                type: string
                required: true

env:
    GH_TOKEN: ${{secrets.DHIS2_BOT_GITHUB_TOKEN}}
    CI: true

jobs:
    deploy-to-im-idv-playground-instance:
        if: ${{ !github.event.repository.fork && github.ref == 'refs/heads/master' }}

        runs-on: ubuntu-latest
        steps:
            # Without a ref (the nightly and manual runs) this checks out master
            - uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.ref }}

            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: lts/*
                  cache: pnpm

            - name: Install
              run: pnpm install --frozen-lockfile --ignore-scripts

            - name: Build
              run: pnpm d2-app-scripts build

            - name: Deploy build to IM idv-playground instance
              run: pnpm d2-app-scripts deploy https://dev.im.dhis2.org/idv-playground --username=admin --password=district
