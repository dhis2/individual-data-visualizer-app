name: 'deploy: netlify production'

# Requirements:
#
# - Org secrets:
#       DHIS2_BOT_NETLIFY_TOKEN
#       DHIS2_BOT_GITHUB_TOKEN
# - Repo secrets:
#       NETLIFY_SITE_ID

on:
    # Deploys a release by hand, e.g. when the release workflow stopped
    # before its deploy jobs. A re-run of that workflow can't do it: it
    # checks out the commit that started it, which is then behind master, so
    # semantic-release finds nothing to release.
    workflow_dispatch:
        inputs:
            ref:
                description: 'The release tag to deploy, e.g. v1.2.3'
                type: string
                required: true
    # The release workflow calls this after a release, with the release commit
    # as ref. A plain checkout would get the merge commit that started the
    # release, which predates the version bump. Checking out master instead
    # could pick up a commit merged while the release was building.
    workflow_call:
        inputs:
            ref:
                description: 'The commit to deploy'
                type: string
                required: true

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        if: ${{ !github.event.repository.fork && github.ref == 'refs/heads/master' }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.ref }}
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: lts/*
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile --ignore-scripts

            - name: Build
              run: pnpm d2-app-scripts build --standalone

            - name: Deploy
              id: netlify-deploy
              uses: nwtgck/actions-netlify@v4
              timeout-minutes: 1
              with:
                  github-token: ${{ secrets.DHIS2_BOT_GITHUB_TOKEN }}
                  github-deployment-environment: 'netlify'
                  github-deployment-description: 'Production deploy on Netlify'
                  deploy-message: ${{ github.event.head_commit.message }}
                  production-deploy: true
                  enable-pull-request-comment: false
                  enable-commit-comment: true
                  enable-commit-status: true
                  publish-dir: 'build/app'
              env:
                  NETLIFY_AUTH_TOKEN: ${{ secrets.DHIS2_BOT_NETLIFY_TOKEN }}
                  NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
